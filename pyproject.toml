[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archolith-mcp-framework"
version = "0.3.0"
description = "Shared FastMCP infrastructure for Archolith-compatible MCP servers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4,<4",
    "httpx>=0.28.1,<1",
]

[project.urls]
Repository = "https://github.com/Archolith/archolith-mcp-framework"
Changelog = "https://github.com/Archolith/archolith-mcp-framework/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
